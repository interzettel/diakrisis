name: Bootstrap integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate authored records and Python syntax
        run: |
          python tools/check_contracts.py
          python -m py_compile tools/bootstrap_skills.py tools/check_contracts.py
      - name: Official Agent Skills reference validator
        run: |
          python -m pip install --disable-pip-version-check -e tools/upstream/agentskills/skills-ref
          skills-ref validate .agents/skills/terminology-review
          skills-ref to-prompt .agents/skills/terminology-review > "$RUNNER_TEMP/terminology-discovery.xml"
          grep -q 'terminology-review' "$RUNNER_TEMP/terminology-discovery.xml"
      - name: Structural RED control without skill
        run: |
          mv .agents/skills/terminology-review "$RUNNER_TEMP/terminology-review"
          set +e
          python -m unittest discover -s tests -p test_terminology_skill.py -v > "$RUNNER_TEMP/red.log" 2>&1
          exit_code=$?
          set -e
          mv "$RUNNER_TEMP/terminology-review" .agents/skills/terminology-review
          if [ "$exit_code" -eq 0 ] || ! grep -q "RED: terminology-review SKILL.md is absent" "$RUNNER_TEMP/red.log"; then
            cat "$RUNNER_TEMP/red.log"
            exit 1
          fi
          echo "Observed expected absence-of-skill RED control; this is NOT a model-behavior baseline"
      - name: Test candidate skill contract
        run: python -m unittest discover -s tests -v
      - name: Preview full pinned skill installation
        run: |
          mkdir -p "$RUNNER_TEMP/diakrisis-skill-test"
          python tools/bootstrap_skills.py --target "$RUNNER_TEMP/diakrisis-skill-test"
      - name: Validate Project Record Standard ledger
        run: |
          PYTHONPATH=tools/upstream/project-record-standard/src python -m project_record check --config progress/project-record.json
          PYTHONPATH=tools/upstream/project-record-standard/src python -m project_record adoption-plan --config progress/project-record.json
      - name: Install in disposable project and verify outputs
        run: |
          python tools/bootstrap_skills.py --target "$RUNNER_TEMP/diakrisis-skill-test" --apply
          test -f "$RUNNER_TEMP/diakrisis-skill-test/.agents/skills/skill-creator/SKILL.md"
          test -f "$RUNNER_TEMP/diakrisis-skill-test/.agents/skills/writing-skills/SKILL.md"
          test -f "$RUNNER_TEMP/diakrisis-skill-test/.agents/skills/use-project-records/SKILL.md"
          python tools/bootstrap_skills.py --target "$RUNNER_TEMP/diakrisis-skill-test"
