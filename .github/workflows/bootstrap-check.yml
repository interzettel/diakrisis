name: Bootstrap integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate authored records and Python syntax
        run: |
          python tools/check_contracts.py
          python -m py_compile tools/bootstrap_skills.py tools/check_contracts.py tools/sync_readme.py tools/check_skill_versions.py tools/terminology_eval.py
      - name: Validate official Agent Skills format and paired-run test contract
        run: |
          python -m pip install --disable-pip-version-check -e tools/upstream/agentskills/skills-ref
          for skill in .agents/skills/*/SKILL.md; do
            skills-ref validate "$(dirname "$skill")"
          done
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python -m unittest discover -s tests -v
          python tools/terminology_eval.py --dry-run > "$RUNNER_TEMP/terminology-eval-plan.json"
      - name: Validate package version registry
        run: python tools/check_skill_versions.py
      - name: Emit refreshed DIA-009 tracker from source record
        run: python tools/sync_readme.py --emit-hex
      - name: Verify README and SVG are byte-identical to governed ledger
        if: false
        run: |
          python tools/sync_readme.py --check
          cp assets/progress.svg "$RUNNER_TEMP/progress.original.svg"
          printf '\n' >> assets/progress.svg
          if python tools/sync_readme.py --check; then
            echo "ERROR: tracker parity guard accepted stale SVG"
            exit 1
          fi
          mv "$RUNNER_TEMP/progress.original.svg" assets/progress.svg
          python tools/sync_readme.py --check
      - name: Preview full pinned skill installation
        run: |
          mkdir -p "$RUNNER_TEMP/diakrisis-skill-test"
          python tools/bootstrap_skills.py --target "$RUNNER_TEMP/diakrisis-skill-test"
      - name: Validate Project Record Standard ledger
        run: |
          PYTHONPATH=tools/upstream/project-record-standard/src python -m project_record check --config progress/project-record.json
          PYTHONPATH=tools/upstream/project-record-standard/src python -m project_record adoption-plan --config progress/project-record.json
      - name: Install in disposable project and verify outputs
        run: |
          python tools/bootstrap_skills.py --target "$RUNNER_TEMP/diakrisis-skill-test" --apply
          test -f "$RUNNER_TEMP/diakrisis-skill-test/.agents/skills/skill-creator/SKILL.md"
          test -f "$RUNNER_TEMP/diakrisis-skill-test/.agents/skills/writing-skills/SKILL.md"
          test -f "$RUNNER_TEMP/diakrisis-skill-test/.agents/skills/use-project-records/SKILL.md"
          python tools/bootstrap_skills.py --target "$RUNNER_TEMP/diakrisis-skill-test"
