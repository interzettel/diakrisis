name: Bootstrap integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository bootstrap
        run: python tools/check_contracts.py
      - name: Syntax check tool scripts
        run: python -m py_compile tools/bootstrap_skills.py tools/check_contracts.py
